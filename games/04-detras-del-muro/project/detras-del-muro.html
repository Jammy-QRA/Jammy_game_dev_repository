<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Detrás del Muro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --void:#0a0a0d;
  --bg1:#14151c;         /* acto I desktop base */
  --bg1b:#191a24;
  --bg2:#181420;         /* acto II desktop base */
  --bg2b:#1e1626;
  --panel:#1c1d26;
  --panel2:#22232e;
  --border:#2d2f3b;
  --border-soft:#24252f;
  --text:#eeeef3;
  --text-dim:#a3a6b5;
  --text-faint:#6c6f80;
  --vinculo-1:#7c5cfc;
  --vinculo-2:#35d0c4;
  --reyes:#ffb238;
  --valentina:#ff7aa2;
  --rojas:#8891a5;
  --anon:#c24b4b;
  --danger:#e5484d;
  --good:#4cc38a;
  --radius:16px;
  --radius-sm:10px;
  --shadow: 0 24px 70px rgba(0,0,0,0.5);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--void);}
body{
  font-family:var(--font-body);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--vinculo-1);color:#fff;}
#root{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- Utility ---------- */
.fade-in{animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){
  .fade-in, .pulse, .badge-pulse, .flicker, .typewatch{animation:none !important;}
}

/* ---------- Cinematic screens (warning, transitions, endings) ---------- */
.cinematic{
  flex:1;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% -10%, #1c1a2c 0%, var(--void) 60%);
  padding:32px 20px;
}
.cine-card{max-width:640px;width:100%;text-align:center;}
.cine-eyebrow{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:18px;
}
.cine-title{
  font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vw,46px);
  letter-spacing:-0.01em;margin:0 0 18px;line-height:1.08;
}
.cine-body{
  font-size:16px;line-height:1.7;color:var(--text-dim);margin:0 0 30px;
  text-align:left;
}
.cine-body p{margin:0 0 14px;}
.cine-body strong{color:var(--text);}
.cine-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

.btn{
  border:none;border-radius:999px;padding:14px 26px;font-size:14.5px;font-weight:600;
  font-family:var(--font-body);transition:transform .15s ease, opacity .15s ease, background .15s ease;
  letter-spacing:.01em;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--vinculo-1),var(--vinculo-2));color:#fff;}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--text-faint);}
.btn-block{width:100%;}

.warn-badge{
  display:inline-flex;align-items:center;gap:8px;background:rgba(229,72,77,0.1);
  border:1px solid rgba(229,72,77,0.35);color:#ff9498;padding:8px 16px;border-radius:999px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;margin-bottom:22px;
}

.divider-line{width:40px;height:2px;background:var(--border);margin:22px auto;border-radius:2px;}

.act-tag{
  display:inline-block;font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;
  padding:6px 14px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim);
  margin-bottom:20px;
}
.act-tag.mateo{border-color:rgba(124,92,252,0.4);color:#b6a6ff;}
.act-tag.lucia{border-color:rgba(53,208,196,0.4);color:#8fe9e0;}

/* ---------- OS chrome ---------- */
.os-frame{
  flex:1;min-height:100vh;display:flex;flex-direction:column;position:relative;
  background: radial-gradient(1200px 600px at 15% -10%, var(--bg1b), var(--bg1) 55%);
  transition: filter .8s ease;
}
.os-frame.act2{background: radial-gradient(1200px 600px at 85% -10%, var(--bg2b), var(--bg2) 55%);}
.os-frame.dim-1{filter:saturate(.82) brightness(.92);}
.os-frame.dim-2{filter:saturate(.6) brightness(.8);}
.os-frame.dim-3{filter:saturate(.3) brightness(.55);}

.statusbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;border-bottom:1px solid var(--border-soft);
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
  backdrop-filter:blur(6px);
}
.statusbar .sb-left{display:flex;align-items:center;gap:10px;}
.statusbar .sb-owner{
  width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:11px;color:#0a0a0d;
}
.owner-mateo{background:linear-gradient(135deg,var(--vinculo-1),#a48bff);}
.owner-lucia{background:linear-gradient(135deg,var(--vinculo-2),#7ce9df);}
.sb-progress{color:var(--text-faint);}
.sb-right{display:flex;align-items:center;gap:14px;}
.sb-reset{background:none;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;}
.sb-reset:hover{color:var(--text-dim);}

.desktop-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:26px 20px 90px;position:relative;}
.desktop-prompt{max-width:560px;text-align:center;margin:18px 0 34px;}
.desktop-prompt h2{font-family:var(--font-display);font-size:21px;margin:0 0 8px;font-weight:600;}
.desktop-prompt p{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin:0;}

.icon-grid{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;max-width:560px;}
.app-icon{
  display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;
  color:var(--text-dim);font-family:var(--font-body);font-size:12.5px;position:relative;
  width:84px;padding:6px;border-radius:10px;
}
.app-icon .glyph{
  width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:22px;color:#0a0a0d;
  box-shadow: var(--shadow); position:relative;
}
.app-icon.active .glyph{outline:2px solid rgba(255,255,255,0.5);}
.app-icon.disabled{opacity:.35;pointer-events:none;}
.app-icon.pulse .glyph{animation:pulseGlow 1.8s ease-in-out infinite;}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,178,56,0.5), var(--shadow);}
  50%{box-shadow:0 0 0 10px rgba(255,178,56,0), var(--shadow);}
}
.glyph-vinculo{background:linear-gradient(135deg,var(--vinculo-1),var(--vinculo-2));}
.glyph-reyes{background:linear-gradient(135deg,var(--reyes),#ffd27a);}
.glyph-notas{background:linear-gradient(135deg,#f4e58a,#e8c95a);}
.glyph-galeria{background:linear-gradient(135deg,#ff9fb8,var(--valentina));}
.glyph-inbox{background:linear-gradient(135deg,#9aa4bd,var(--rojas));}

.icon-badge{
  position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;
  font-family:var(--font-mono);font-size:10px;min-width:17px;height:17px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600;
  border:2px solid var(--bg1);
}

/* windows */
.window{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:0 auto;
}
.window-titlebar{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border-soft);
  background:var(--panel2);
}
.tb-dots{display:flex;gap:6px;}
.tb-dots span{width:9px;height:9px;border-radius:50%;background:var(--border);}
.window-app{
  width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:12px;color:#0a0a0d;
}
.window-titletext{font-size:13.5px;font-weight:600;color:var(--text);}
.window-sub{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);}
.window-body{padding:0;max-height:58vh;overflow-y:auto;}
.window-foot{padding:14px 16px;border-top:1px solid var(--border-soft);background:var(--panel2);}

/* feed post */
.feed-post{padding:16px;}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.avatar{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:13px;color:#0a0a0d;flex-shrink:0;
}
.post-name{font-size:13.5px;font-weight:600;}
.post-time{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);}
.post-art{
  width:100%;aspect-ratio:4/3;border-radius:12px;margin-bottom:10px;overflow:hidden;
  background:linear-gradient(135deg,#2a2140,#1a3a3a);display:flex;align-items:center;justify-content:center;
}
.post-caption{font-size:13.5px;color:var(--text-dim);line-height:1.55;margin-bottom:10px;}
.post-meta{display:flex;gap:16px;font-size:12px;color:var(--text-faint);font-family:var(--font-mono);margin-bottom:4px;}

.comment-list{border-top:1px solid var(--border-soft);}
.comment{padding:12px 16px;display:flex;gap:10px;border-bottom:1px solid var(--border-soft);}
.comment:last-child{border-bottom:none;}
.comment .avatar{width:28px;height:28px;font-size:11px;}
.comment-body{flex:1;}
.comment-name{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
.comment-text{font-size:13px;color:var(--text-dim);line-height:1.5;margin-top:2px;}
.tag-real{font-family:var(--font-mono);font-size:9.5px;color:var(--danger);border:1px solid rgba(229,72,77,.4);padding:1px 6px;border-radius:999px;}
.tag-anon{font-family:var(--font-mono);font-size:9.5px;color:var(--anon);border:1px solid rgba(194,75,75,.4);padding:1px 6px;border-radius:999px;}

/* chat */
.chat-body{padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{display:flex;gap:9px;max-width:88%;}
.chat-msg .avatar{width:26px;height:26px;font-size:10.5px;flex-shrink:0;}
.chat-bubble{background:var(--panel2);border:1px solid var(--border-soft);border-radius:14px 14px 14px 4px;padding:9px 13px;}
.chat-name{font-size:11.5px;font-weight:600;margin-bottom:2px;}
.chat-text{font-size:13.5px;line-height:1.5;color:var(--text);}
.chat-msg.me{align-self:flex-end;flex-direction:row-reverse;}
.chat-msg.me .chat-bubble{border-radius:14px 14px 4px 14px;background:linear-gradient(135deg,rgba(124,92,252,.28),rgba(53,208,196,.2));border-color:rgba(124,92,252,.35);}
.chat-time{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin-top:4px;}
.chat-system{
  align-self:center;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
  padding:6px 12px;background:var(--panel2);border-radius:999px;margin:4px 0;
}
.chat-pinned{
  align-self:stretch;background:rgba(255,178,56,.09);border:1px solid rgba(255,178,56,.35);
  border-radius:12px;padding:10px 13px;font-size:12.5px;color:#ffd27a;display:flex;gap:8px;align-items:flex-start;
}
.typing-dots{display:inline-flex;gap:3px;align-items:center;}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--text-faint);animation:tdot 1.1s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes tdot{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

/* decision card */
.decision-wrap{width:100%;max-width:560px;margin:0 auto;}
.decision-head{text-align:center;margin-bottom:18px;}
.decision-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--danger);text-transform:uppercase;margin-bottom:8px;}
.decision-q{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0 0 8px;}
.decision-ctx{font-size:13.5px;color:var(--text-dim);font-style:italic;line-height:1.55;}
.decision-options{display:flex;flex-direction:column;gap:14px;}
.option-card{
  text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;transition:border-color .15s ease, transform .15s ease, background .15s ease;
}
.option-card:hover{border-color:var(--vinculo-1);background:var(--panel2);transform:translateY(-2px);}
.option-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;margin-bottom:6px;}
.option-title{font-family:var(--font-display);font-size:16px;font-weight:600;margin-bottom:6px;}
.option-desc{font-size:13.5px;color:var(--text-dim);line-height:1.55;}

/* consequence block */
.consequence-note{
  max-width:560px;margin:20px auto 0;background:rgba(124,92,252,.07);border:1px solid rgba(124,92,252,.25);
  border-radius:var(--radius-sm);padding:14px 16px;
}
.consequence-note .cn-label{font-family:var(--font-mono);font-size:10.5px;color:var(--vinculo-2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.consequence-note p{font-size:13.5px;line-height:1.6;color:var(--text-dim);margin:0;}
.continue-row{max-width:520px;margin:22px auto 0;display:flex;justify-content:center;}

/* notification stack (isolation) */
.notif-stack{display:flex;flex-direction:column;gap:8px;padding:14px 16px;}
.notif-item{
  background:var(--panel2);border:1px solid var(--border-soft);border-radius:10px;padding:10px 13px;
  font-size:12.5px;color:var(--text-faint);display:flex;justify-content:space-between;align-items:center;
  opacity:.75;
}
.notif-item .n-badge{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;margin-right:8px;}
.notif-row{display:flex;align-items:center;}

/* split epilogue */
.split-wrap{display:flex;gap:0;max-width:760px;margin:0 auto;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.split-half{flex:1;padding:20px;min-width:0;}
.split-half.left{background:linear-gradient(160deg,#1b1830,#141319);border-right:1px solid var(--border);}
.split-half.right{background:linear-gradient(200deg,#132420,#0f171a);}
.split-owner{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.split-owner span.tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--text-dim);}
.split-text{font-size:13px;line-height:1.65;color:var(--text-dim);}
@media (max-width:640px){
  .split-wrap{flex-direction:column;}
  .split-half.left{border-right:none;border-bottom:1px solid var(--border);}
}

/* ending screen */
.ending-name{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--vinculo-2);margin-bottom:10px;
}
.ending-title{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,7vw,50px);margin:0 0 20px;}
.vars-strip{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 8px;
  font-family:var(--font-mono);font-size:11px;
}
.var-chip{border:1px solid var(--border);border-radius:999px;padding:5px 12px;color:var(--text-dim);}

/* resources */
.resource-box{
  text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;margin:22px 0;
}
.resource-box h3{font-family:var(--font-display);font-size:15px;margin:0 0 10px;}
.resource-box p, .resource-box li{font-size:13.5px;line-height:1.65;color:var(--text-dim);}
.resource-box ul{margin:8px 0 0;padding-left:18px;}
.resource-box a{color:var(--vinculo-2);}

/* progress dots */
.chapter-dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px;}
.chapter-dots span{width:5px;height:5px;border-radius:50%;background:var(--border);}
.chapter-dots span.on{background:var(--vinculo-2);}

/* draft box for isolation symbolism */
.draft-box{margin:14px 16px 4px;padding:12px 14px;border:1px dashed var(--border);border-radius:10px;}
.draft-label{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.06em;margin-bottom:6px;}
.draft-text{font-size:13px;color:var(--text-faint);font-style:italic;}

@media (max-width:520px){
  .icon-grid{gap:16px;}
  .app-icon{width:72px;}
  .app-icon .glyph{width:50px;height:50px;font-size:19px;}
  .decision-options{gap:10px;}
}
</style>
</head>
<body>
<div id="root"><div id="app"></div></div>

<script>
(function(){

/* =========================================================
   STATE
========================================================= */
const state = {
  step: 'warning',
  exposicion: null,   // 'alta' | 'difusa'
  intensidad: null,   // 'alta' | 'media'
  apoyo: null,        // 'alto' | 'bajo'
  reporte: null,      // 'formal' | 'desaparecer'
  dim: 0
};

function resetState(){
  state.step='warning'; state.exposicion=null; state.intensidad=null;
  state.apoyo=null; state.reporte=null; state.dim=0;
}

/* =========================================================
   SMALL HELPERS
========================================================= */
function esc(s){ return s; } // content is authored, not user input
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function avatar(name, colorVar, size){
  return `<div class="avatar" style="background:${colorVar};width:${size||34}px;height:${size||34}px;font-size:${size?Math.round(size*0.38):13}px;">${initials(name)}</div>`;
}

function windowShell(appLabel, appGlyphClass, appColor, titleText, subText, bodyHtml, footHtml){
  return `
  <div class="window fade-in">
    <div class="window-titlebar">
      <div class="tb-dots"><span></span><span></span><span></span></div>
      <div class="window-app ${appGlyphClass}">${appLabel}</div>
      <div>
        <div class="window-titletext">${titleText}</div>
        ${subText? `<div class="window-sub">${subText}</div>`:''}
      </div>
    </div>
    <div class="window-body">${bodyHtml}</div>
    ${footHtml? `<div class="window-foot">${footHtml}</div>` : ''}
  </div>`;
}

function decisionCard(label, question, context, options){
  // options: [{tag,title,desc,action}]
  return `
  <div class="decision-wrap fade-in">
    <div class="decision-head">
      <div class="decision-label">${label}</div>
      <div class="decision-q">${question}</div>
      <div class="decision-ctx">${context}</div>
    </div>
    <div class="decision-options">
      ${options.map(o => `
        <button class="option-card" data-action="${o.action}">
          <div class="option-label">${o.tag}</div>
          <div class="option-title">${o.title}</div>
          <div class="option-desc">${o.desc}</div>
        </button>
      `).join('')}
    </div>
  </div>`;
}

function consequenceNote(label, text){
  return `<div class="consequence-note fade-in"><div class="cn-label">${label}</div><p>${text}</p></div>`;
}

function continueBtn(action, label){
  return `<div class="continue-row"><button class="btn btn-primary" data-action="${action}">${label||'Continuar'}</button></div>`;
}

function chapterDots(n,total){
  let out='<div class="chapter-dots">';
  for(let i=1;i<=total;i++) out+=`<span class="${i<=n?'on':''}"></span>`;
  out+='</div>';
  return out;
}

/* =========================================================
   OS FRAME (desktop / app / decision screens)
========================================================= */
function renderOS(opts){
  // opts: {act, owner, actLabel, chapterLabel, dimClass, body}
  const ownerBadge = opts.act===1
    ? `<div class="sb-owner owner-mateo">M</div>`
    : `<div class="sb-owner owner-lucia">L</div>`;
  return `
  <div class="os-frame ${opts.act===2?'act2':''} ${opts.dimClass||''}">
    <div class="statusbar">
      <div class="sb-left">
        ${ownerBadge}
        <span>${opts.actLabel}</span>
        <span class="sb-progress">· ${opts.chapterLabel}</span>
      </div>
      <div class="sb-right">
        <span>21:4${state.dim} · LTE</span>
        <button class="sb-reset" data-action="restart">reiniciar</button>
      </div>
    </div>
    <div class="desktop-area">${opts.body}</div>
  </div>`;
}

function desktopIcons(act, icons, activeAction){
  // icons: [{key,label,glyph,glyphClass,badge,disabled,pulse,action}]
  return `<div class="icon-grid">
    ${icons.map(ic=>`
      <button class="app-icon ${ic.disabled?'disabled':''} ${ic.pulse?'pulse':''}" data-action="${ic.action}">

/* =========================================================
   RENDER LOOP
========================================================= */
function goto(id){ state.step=id; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function render(){
  const app = document.getElementById('app');
  const stepFn = STEPS[state.step];
  if(!stepFn){ app.innerHTML = '<div class="cinematic"><div class="cine-card">Paso no encontrado: '+state.step+'</div></div>'; return; }
  const out = stepFn(state);
  if(out.mode==='cinematic'){
    app.innerHTML = `<div class="cinematic">${out.html}</div>`;
  } else {
    app.innerHTML = renderOS({act:out.act, actLabel:out.actLabel, chapterLabel:out.chapterLabel, dimClass:out.dimClass, body:out.html});
  }
}

document.getElementById('app').addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.getAttribute('data-action');
  if(action==='noop') return;
  if(actions[action]) actions[action]();
});

render();
})();
</script>
